<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convertidor de archivos · Nexus Local Click</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090c1d;--panel:rgba(255,255,255,.05);--line:rgba(255,255,255,.13);--txt:#eaf0ff;--muted:#9aa6c8;--blue:#4f8cff;--violet:#8b5cf6;--err:#ff7a90;--ok:#5be3a4}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:24px 16px;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;width:60vmax;height:60vmax;left:50%;top:-25vmax;transform:translateX(-50%);background:radial-gradient(circle,rgba(79,140,255,.35),rgba(139,92,246,.22) 45%,transparent 70%);filter:blur(30px);pointer-events:none;z-index:0}
main{position:relative;z-index:1;width:100%;max-width:480px}
h1{font-family:Sora,system-ui,sans-serif;font-size:1.5rem;margin:0 0 6px}
.brand{font-family:Sora,system-ui,sans-serif;font-weight:700;font-size:1.05rem;margin:8px 0 22px;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--violet))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sub{color:var(--muted);margin:0 0 20px}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.25);padding:4px;border-radius:12px;margin-bottom:6px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px;border-radius:9px;font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:rgba(255,255,255,.1);color:var(--txt)}
label{display:block;font-size:.88rem;color:var(--muted);margin:14px 0 6px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--txt);font:inherit}
select option{background:#14183a}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
small{color:var(--muted);display:block;margin-top:6px}
.btn{display:block;width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;font:inherit;font-weight:600;color:#fff;text-align:center;text-decoration:none;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--violet))}
.btn:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.4em;margin:14px 0 0;font-size:.92rem}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
#out{margin-top:8px}#pv{display:block;max-width:100%;max-height:220px;margin:16px auto 0;border-radius:12px;border:1px solid var(--line)}
[hidden]{display:none!important}
</style></head>
<body><main>
<div class="brand"><i></i>Nexus Local Click</div>
<section class="card">
<h1>Convertidor de archivos</h1>
<p class="sub">Cambia el formato de tus imágenes y documentos.</p>
<div class="tabs" role="tablist"><button type="button" role="tab" id="t-imagen" aria-selected="true">Imágenes</button><button type="button" role="tab" id="t-documento" aria-selected="false">Documentos</button><button type="button" role="tab" id="t-zip" aria-selected="false">Comprimir</button></div>
<form id="f" novalidate>
<label for="file">Archivo</label><input id="file" type="file"><small id="info"></small>
<div id="fw"><label for="fmt">Convertir a</label><select id="fmt" disabled><option>Elige un archivo primero</option></select></div>
<div id="zn" hidden><label for="zname">Nombre del ZIP</label><input id="zname" value="archivos" maxlength="60"></div>
<div id="w"><label for="ancho">Tamaño (ancho máximo)</label><select id="ancho"><option value="0">Original</option><option value="1920">1920 px</option><option value="1280">1280 px</option><option value="800">800 px</option></select></div>
<div id="q" hidden><label for="cal">Calidad</label><select id="cal"><option value=".92">Alta</option><option value=".8" selected>Media</option><option value=".6">Baja (archivo más ligero)</option></select></div>
<label id="tokl">Tu token<input id="tok" type="password" autocomplete="off"></label>
<button class="btn" id="go" type="submit">Convertir</button>
<p class="msg" id="m" role="status" aria-live="polite"></p>
</form>
<div id="out" hidden><img id="pv" alt="Vista previa" hidden><a class="btn" id="dl" href="#">Descargar</a></div>
<small id="priv"></small>
</section></main>
<script>
const API='https://core.localclick.com.mx/webhook/convertir'; // servidor de n8n
// Las imágenes se convierten en el navegador. Cuando exista el flujo "portal-consumir" en n8n, cambia a true
// para que cada conversión descuente una consulta del plan.
const CONTAR=true;
const $=s=>document.querySelector(s);
const CFG={
 imagen:{accept:'image/*',max:25,info:'Cualquier imagen (JPG, PNG, WEBP, GIF…). Máximo 25 MB.',priv:'Tus imágenes se convierten en tu dispositivo: no se suben a ningún servidor.'},
 documento:{accept:'.doc,.docx,.odt,.rtf,.txt,.xls,.xlsx,.ods,.csv,.ppt,.pptx,.odp',max:15,info:'Word, Excel, PowerPoint, OpenDocument, RTF, TXT o CSV. Máximo 15 MB.',priv:'Tus documentos se procesan en el servidor y se borran al terminar.'},
 zip:{accept:'',max:60,info:'Elige uno o varios archivos para juntarlos en un ZIP. Máximo 60 MB en total.',priv:'Se comprimen en tu dispositivo: no se suben a ningún servidor.'}};
const DOC=[{ext:['doc','docx','odt','rtf','txt'],to:['pdf','docx','odt','txt']},{ext:['xls','xlsx','ods','csv'],to:['pdf','xlsx','ods','csv']},{ext:['ppt','pptx','odp'],to:['pdf','pptx','odp']}];
let tipo='imagen',url=null,sesion='';
try{sesion=sessionStorage.getItem('nlc_token')||localStorage.getItem('nlc_token')||''}catch(e){}
if(sesion)$('#tok').value=sesion;
const say=(t,c)=>{const m=$('#m');m.textContent=t||'';m.className='msg '+(c||'')};
const ext=n=>(n.split('.').pop()||'').toLowerCase().replace('jpeg','jpg').replace('tif','tiff');
const kb=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const necesitaToken=()=>tipo==='documento'||CONTAR;

function opciones(){
  if(tipo==='zip'){const fs=[...$('#file').files];$('#info').textContent=fs.length?fs.length+' archivo(s) · '+kb(fs.reduce((a,x)=>a+x.size,0)):CFG.zip.info;$('#q').hidden=true;say('');return}
  const f=$('#file').files[0],s=$('#fmt');s.innerHTML='';
  if(!f){s.disabled=true;s.innerHTML='<option>Elige un archivo primero</option>';$('#q').hidden=true;return}
  const e=ext(f.name);let op=[];
  if(tipo==='imagen'){
    ['jpg','png','webp','pdf'].forEach(x=>{if(x!==e)op.push([x,x.toUpperCase()]);else if(x==='jpg'||x==='webp')op.push([x,x.toUpperCase()+' (comprimir)'])});
  }else op=((DOC.find(g=>g.ext.includes(e))||{}).to||[]).filter(x=>x!==e).map(x=>[x,x.toUpperCase()]);
  if(!op.length){s.disabled=true;s.innerHTML='<option>Formato no compatible</option>';$('#q').hidden=true;say('Ese tipo de archivo no se puede convertir aquí.','err');return}
  s.disabled=false;op.forEach(([v,t])=>s.add(new Option(t,v)));say('');calidad();
}
function calidad(){$('#q').hidden=!(tipo==='imagen'&&['jpg','webp'].includes($('#fmt').value))}
$('#fmt').onchange=calidad;
function setTipo(t){
  tipo=t;['imagen','documento','zip'].forEach(k=>$('#t-'+k).setAttribute('aria-selected',k===t));$('#file').multiple=t==='zip';$('#fw').hidden=t==='zip';$('#zn').hidden=t!=='zip';$('#go').textContent=t==='zip'?'Comprimir':'Convertir';
  $('#file').value='';$('#file').accept=CFG[t].accept;$('#info').textContent=CFG[t].info;$('#priv').textContent=CFG[t].priv;
  $('#w').hidden=t!=='imagen';$('#out').hidden=true;$('#tokl').hidden=!(necesitaToken()&&!sesion);opciones();say('');
}
$('#t-imagen').onclick=()=>setTipo('imagen');$('#t-documento').onclick=()=>setTipo('documento');$('#t-zip').onclick=()=>setTipo('zip');
$('#file').onchange=()=>{const f=$('#file').files[0];$('#out').hidden=true;
  const tot=[...$('#file').files].reduce((a,x)=>a+x.size,0);
  if(f&&(tipo==='zip'?tot:f.size)>CFG[tipo].max*1048576){$('#file').value='';opciones();say('Pesa más de '+CFG[tipo].max+' MB.','err');return}
  opciones()};

// ---- Imágenes: todo en el navegador ----
async function imagen(f,fm,ancho,cal){
  let bm;try{bm=await createImageBitmap(f)}catch(e){throw new Error('No se pudo leer esa imagen. Prueba con una JPG o PNG.')}
  let k=ancho>0?Math.min(1,ancho/bm.width):1;
  if(bm.width*bm.height*k*k>16e6)k=Math.sqrt(16e6/(bm.width*bm.height)); // tope seguro para celulares
  const w=Math.max(1,Math.round(bm.width*k)),h=Math.max(1,Math.round(bm.height*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  if(fm==='jpg'||fm==='pdf'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}
  x.drawImage(bm,0,0,w,h);if(bm.close)bm.close();
  const mime={jpg:'image/jpeg',pdf:'image/jpeg',png:'image/png',webp:'image/webp'}[fm];
  const blob=await new Promise(r=>c.toBlob(r,mime,cal));
  if(!blob||(fm==='webp'&&blob.type!=='image/webp'))throw new Error('Tu navegador no puede guardar en '+fm.toUpperCase()+'. Elige otro formato.');
  return fm==='pdf'?pdf(blob,w,h):blob;
}
async function pdf(jpg,w,h){
  const img=new Uint8Array(await jpg.arrayBuffer()),enc=new TextEncoder(),parts=[],off=[];let n=0;
  const add=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);n+=u.length};
  const obj=(i,s)=>{off[i]=n;add(i+' 0 obj\n'+s+'\nendobj\n')};
  const pw=595,ph=+(h*pw/w).toFixed(2);
  add('%PDF-1.4\n');obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
  obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im 4 0 R>>>>/Contents 5 0 R>>`);
  off[4]=n;add(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${img.length}>>\nstream\n`);add(img);add('\nendstream\nendobj\n');
  const cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im Do Q`;obj(5,`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);
  const xr=n;let t='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)t+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  add(t+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=~0;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(~c)>>>0};
async function deflar(u){if(typeof CompressionStream==='undefined')return null;
  return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer())}
async function zip(files){
  const te=new TextEncoder(),out=[],cd=[],usados=new Set();let pos=0;
  for(const f of files){
    const raw=new Uint8Array(await f.arrayBuffer());
    let name=f.name,i=1;while(usados.has(name)){const p=f.name.lastIndexOf('.');name=p>0?f.name.slice(0,p)+' ('+i+')'+f.name.slice(p):f.name+' ('+i+')';i++}usados.add(name);
    const nb=te.encode(name),crc=crc32(raw);let data=raw,m=0;
    const z=raw.length?await deflar(raw):null;if(z&&z.length<raw.length){data=z;m=8}
    const d=new Date(f.lastModified||Date.now()),dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((Math.max(d.getFullYear(),1980)-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,m,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,raw.length,true);lh.setUint16(26,nb.length,true);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,m,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,raw.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,pos,true);
    out.push(lh,nb,data);cd.push(ch,nb);pos+=30+nb.length+data.length;
  }
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
  end.setUint32(12,cd.reduce((a,x)=>a+x.byteLength,0),true);end.setUint32(16,pos,true);
  return new Blob([...out,...cd,end],{type:'application/zip'});
}
function entregarZip(b,nm,fs,rest){
  if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);
  $('#dl').href=url;$('#dl').download=nm+'.zip';$('#pv').hidden=true;$('#out').hidden=false;
  say('Listo: '+fs.length+' archivo(s), '+kb(fs.reduce((a,x)=>a+x.size,0))+' → '+kb(b.size)+'.'+(rest!=null?' Te quedan '+rest+' consultas hoy.':''),'ok');
}
async function descontar(tok){
  const r=await fetch(API+'/portal-consumir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok,servicio:'convertidor'})});
  let d={};try{d=await r.json()}catch(_){}
  if(!d.success)throw new Error(d.message||'No se pudo descontar tu consulta. Intenta de nuevo.');
  return d.consultas_restantes;
}
function entregar(blob,f,fm,extra){
  if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);
  const comp=ext(f.name)===fm?'-comprimido':'';
  $('#dl').href=url;$('#dl').download=(f.name.replace(/\.[^.]+$/,'')||'archivo')+comp+'.'+fm;
  const pv=$('#pv');pv.hidden=!(tipo==='imagen'&&['jpg','png','webp'].includes(fm));if(!pv.hidden)pv.src=url;
  $('#out').hidden=false;
  say('Listo'+(tipo==='imagen'?': '+kb(f.size)+' → '+kb(blob.size)+'.':'.')+(extra!=null?' Te quedan '+extra+' consultas hoy.':''),'ok');
}

$('#f').onsubmit=async e=>{
  e.preventDefault();
  const f=$('#file').files[0],tok=($('#tok').value||'').trim(),fm=$('#fmt').value;
  if(!f){say('Elige un archivo.','err');return}
  if(tipo!=='zip'&&$('#fmt').disabled){say('Ese tipo de archivo no se puede convertir aquí.','err');return}
  if(necesitaToken()&&!tok){say('Entra a tu panel para usar este servicio.','err');return}
  $('#go').disabled=true;$('#out').hidden=true;
  try{
    if(tipo==='zip'){
      say('Comprimiendo…');let rest=null;if(CONTAR)rest=await descontar(tok);
      const fs=[...$('#file').files],b=await zip(fs),nm=($('#zname').value||'').replace(/[\\/:*?"<>|]/g,'').trim()||'archivos';
      entregarZip(b,nm,fs,rest);
    }else if(tipo==='imagen'){
      say('Convirtiendo…');let rest=null;
      if(CONTAR)rest=await descontar(tok);
      const b=await imagen(f,fm,+$('#ancho').value,+$('#cal').value);
      entregar(b,f,fm,rest);
    }else{
      say('Convirtiendo… los documentos pueden tardar hasta un minuto.');
      const fd=new FormData();fd.append('token',tok);fd.append('tipo',tipo);fd.append('formato',fm);fd.append('archivo',f,f.name);
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),120000);
      try{
        const r=await fetch(API+'/convertir',{method:'POST',body:fd,signal:ctl.signal});
        if(!r.ok||(r.headers.get('content-type')||'').includes('application/json')){let d={};try{d=await r.json()}catch(_){}throw new Error(d.message||'No se pudo convertir. Intenta de nuevo.')}
        entregar(await r.blob(),f,fm,null);
      }finally{clearTimeout(to)}
    }
  }catch(err){say(err.name==='AbortError'?'Tardó demasiado. Prueba con un archivo más pequeño.':(err instanceof TypeError?(navigator.onLine===false?'Sin internet. Revisa tu conexión e intenta de nuevo.':'El servidor no respondió bien. Intenta de nuevo en un momento.'):err.message),'err')}
  finally{$('#go').disabled=false}
};
setTipo('imagen');
</script></body></html>
