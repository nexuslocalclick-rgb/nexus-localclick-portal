<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ficha + QR Offline</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 1rem;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 1.25rem;
    }
    .box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.7rem;
      margin-bottom: 0.3rem;
    }
    label:first-child { margin-top: 0; }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0b1220;
      color: #f8fafc;
      font-size: 0.95rem;
    }
    input[type="color"] {
      height: 40px;
      padding: 0.2rem;
      cursor: pointer;
    }
    .row {
      display: flex;
      gap: 0.6rem;
    }
    .row > div { flex: 1; }
    button {
      margin-top: 1rem;
      background: #22c55e;
      color: #052e16;
      border: none;
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 10px;
      background: #ffffff;
      display: block;
    }
    .status {
      margin-top: 0.6rem;
      font-size: 0.85rem;
      color: #94a3b8;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <label for="card-title">Título / Negocio</label>
      <input id="card-title" type="text" value="Generador de paginas web" />

      <label for="card-subtitle">Subtítulo / Especialidad</label>
      <input id="card-subtitle" type="text" value="Diagnóstico y atención rápida" />

      <label for="card-details">Datos / Horario / Contacto</label>
      <textarea id="card-details" rows="3">Lun a Vie 9:00 - 18:00 · Cotizaciones sin compromiso</textarea>

      <label for="card-qr">Texto o enlace para el QR</label>
      <input id="card-qr" type="text" value="https://localclick.com.mx" />

      <div class="row">
        <div>
          <label for="card-color">Color principal</label>
          <input id="card-color" type="color" value="#0f172a" />
        </div>
        <div>
          <label for="card-accent">Color de acento</label>
          <input id="card-accent" type="color" value="#0284c7" />
        </div>
      </div>

      <button type="button" id="card-download-btn">Descargar PNG</button>
      <div id="card-status" class="status"></div>
    </div>

    <div class="box">
      <canvas id="card-canvas" width="800" height="450"></canvas>
    </div>
  </div>

  <script>
    // Generador QR compacto en Byte Mode (versión 1 a 6, ECC L) 100% local sin dependencias
    const QR_LOCAL = (function () {
      const EXP = new Uint8Array(256);
      const LOG = new Uint8Array(256);
      let x = 1;
      for (let i = 0; i < 255; i++) {
        EXP[i] = x;
        LOG[x] = i;
        x <<= 1;
        if (x & 0x100) x ^= 0x11d;
      }
      for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];

      function gfMul(a, b) {
        if (a === 0 || b === 0) return 0;
        return EXP[LOG[a] + LOG[b]];
      }

      function rsPoly(ecLen) {
        let poly = [1];
        for (let i = 0; i < ecLen; i++) {
          const next = new Array(poly.length + 1).fill(0);
          const factor = EXP[i];
          for (let j = 0; j < poly.length; j++) {
            next[j] ^= poly[j];
            next[j + 1] ^= gfMul(poly[j], factor);
          }
          poly = next;
        }
        return poly.slice(1);
      }

      function rsEncode(data, ecLen) {
        const gen = rsPoly(ecLen);
        const ecc = new Array(ecLen).fill(0);
        for (let i = 0; i < data.length; i++) {
          const lead = data[i] ^ ecc[0];
          for (let j = 0; j < ecLen - 1; j++) {
            ecc[j] = ecc[j + 1] ^ gfMul(lead, gen[j]);
          }
          ecc[ecLen - 1] = gfMul(lead, gen[ecLen - 1]);
        }
        return ecc;
      }

      // [version, totalDataCodewords, ecCodewordsPerBlock, blocks]
      const SPECS = [
        [1, 19, 7, 1],
        [2, 34, 10, 1],
        [3, 55, 15, 1],
        [4, 80, 20, 1],
        [5, 108, 26, 1],
        [6, 136, 18, 2]
      ];

      function chooseSpec(byteLen) {
        for (const spec of SPECS) {
          const ccBits = spec[0] < 10 ? 8 : 16;
          const capBytes = Math.floor((spec[1] * 8 - 4 - ccBits) / 8);
          if (byteLen <= capBytes) return spec;
        }
        return null;
      }

      function buildCodewords(text, spec) {
        const bytes = new TextEncoder().encode(text);
        const [ver, totalData, ecLen, numBlocks] = spec;
        const ccBits = ver < 10 ? 8 : 16;
        const bits = [];
        const pushBits = (val, len) => {
          for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1);
        };

        pushBits(0b0100, 4); // Byte mode
        pushBits(bytes.length, ccBits);
        for (const b of bytes) pushBits(b, 8);

        const totalBits = totalData * 8;
        const term = Math.min(4, totalBits - bits.length);
        pushBits(0, term);
        while (bits.length % 8 !== 0) bits.push(0);

        const padBytes = [0xec, 0x11];
        let pIdx = 0;
        while (bits.length < totalBits) {
          pushBits(padBytes[pIdx % 2], 8);
          pIdx++;
        }

        const dataCw = [];
        for (let i = 0; i < bits.length; i += 8) {
          let v = 0;
          for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
          dataCw.push(v);
        }

        const b1 = Math.floor(totalData / numBlocks);
        const rem = totalData % numBlocks;
        const dBlocks = [];
        const eBlocks = [];
        let offset = 0;
        for (let b = 0; b < numBlocks; b++) {
          const len = b1 + (b >= numBlocks - rem ? 1 : 0);
          const slice = dataCw.slice(offset, offset + len);
          offset += len;
          dBlocks.push(slice);
          eBlocks.push(rsEncode(slice, ecLen));
        }

        const finalCw = [];
        const maxD = Math.max(...dBlocks.map((x) => x.length));
        for (let i = 0; i < maxD; i++) {
          for (const blk of dBlocks) if (i < blk.length) finalCw.push(blk[i]);
        }
        for (let i = 0; i < ecLen; i++) {
          for (const blk of eBlocks) finalCw.push(blk[i]);
        }
        return finalCw;
      }

      function createMatrix(ver) {
        const size = ver * 4 + 17;
        const grid = Array.from({ length: size }, () => Array(size).fill(null));
        const reserved = Array.from({ length: size }, () => Array(size).fill(false));

        function putFinder(r0, c0) {
          for (let r = -1; r <= 7; r++) {
            for (let c = -1; c <= 7; c++) {
              const rr = r0 + r;
              const cc = c0 + c;
              if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
              const inBox = r >= 0 && r <= 6 && c >= 0 && c <= 6;
              const border = r === 0 || r === 6 || c === 0 || c === 6;
              const center = r >= 2 && r <= 4 && c >= 2 && c <= 4;
              grid[rr][cc] = inBox && (border || center) ? 1 : 0;
              reserved[rr][cc] = true;
            }
          }
        }

        putFinder(0, 0);
        putFinder(0, size - 7);
        putFinder(size - 7, 0);

        if (ver >= 2) {
          const alignPos = ver === 2 ? [6, 18] : ver === 3 ? [6, 22] : ver === 4 ? [6, 26] : ver === 5 ? [6, 30] : [6, 34];
          for (const ar of alignPos) {
            for (const ac of alignPos) {
              if (reserved[ar][ac]) continue;
              for (let dr = -2; dr <= 2; dr++) {
                for (let dc = -2; dc <= 2; dc++) {
                  const isDark = Math.abs(dr) === 2 || Math.abs(dc) === 2 || (dr === 0 && dc === 0);
                  grid[ar + dr][ac + dc] = isDark ? 1 : 0;
                  reserved[ar + dr][ac + dc] = true;
                }
              }
            }
          }
        }

        for (let i = 8; i < size - 8; i++) {
          if (!reserved[6][i]) {
            grid[6][i] = i % 2 === 0 ? 1 : 0;
            reserved[6][i] = true;
          }
          if (!reserved[i][6]) {
            grid[i][6] = i % 2 === 0 ? 1 : 0;
            reserved[i][6] = true;
          }
        }

        grid[size - 8][8] = 1;
        reserved[size - 8][8] = true;

        // Reservar celdas de formato (ECC L = 01, mask 0)
        for (let i = 0; i < 9; i++) {
          if (i < size) {
            reserved[8][i] = true;
            reserved[i][8] = true;
          }
        }
        for (let i = 0; i < 8; i++) {
          reserved[8][size - 1 - i] = true;
          reserved[size - 1 - i][8] = true;
        }

        return { grid, reserved, size };
      }

      function placeBits(grid, reserved, size, codewords) {
        const bits = [];
        for (const cw of codewords) {
          for (let i = 7; i >= 0; i--) bits.push((cw >> i) & 1);
        }
        let bitIdx = 0;
        let upward = true;

        for (let col = size - 1; col >= 1; col -= 2) {
          if (col === 6) col = 5;
          for (let step = 0; step < size; step++) {
            const row = upward ? size - 1 - step : step;
            for (let cOff = 0; cOff <= 1; cOff++) {
              const c = col - cOff;
              if (reserved[row][c]) continue;
              const rawBit = bitIdx < bits.length ? bits[bitIdx++] : 0;
              // Máscara 0: (row + col) % 2 === 0
              const masked = (row + c) % 2 === 0 ? rawBit ^ 1 : rawBit;
              grid[row][c] = masked;
            }
          }
          upward = !upward;
        }

        // Escribir bits de formato para ECC L (01) y máscara 0 (000) -> 111011111000100
        const fmt = [1, 1, 1, 0, 1, 1, 1, 1, 1, 0, 0, 0, 1, 0, 0];
        const aroundA = [[0, 8], [1, 8], [2, 8], [3, 8], [4, 8], [5, 8], [7, 8], [8, 8], [8, 7], [8, 5], [8, 4], [8, 3], [8, 2], [8, 1], [8, 0]];
        for (let i = 0; i < 15; i++) {
          const [r, c] = aroundA[i];
          grid[r][c] = fmt[i];
        }
        for (let i = 0; i < 8; i++) {
          grid[size - 1 - i][8] = fmt[i];
        }
        for (let i = 0; i < 7; i++) {
          grid[8][size - 7 + i] = fmt[8 + i];
        }
      }

      return function drawQr(ctx, text, x, y, size) {
        const spec = chooseSpec(new TextEncoder().encode(text).length);
        if (!spec) return false;
        const cws = buildCodewords(text, spec);
        const { grid, size: modules } = createMatrix(spec[0]);
        placeBits(grid, null, modules, cws);

        const quiet = 2;
        const totalMod = modules + quiet * 2;
        const cell = size / totalMod;

        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x, y, size, size);
        ctx.fillStyle = '#0f172a';

        for (let r = 0; r < modules; r++) {
          for (let c = 0; c < modules; c++) {
            if (grid[r][c]) {
              const px = Math.floor(x + (c + quiet) * cell);
              const py = Math.floor(y + (r + quiet) * cell);
              const pw = Math.ceil(cell);
              const ph = Math.ceil(cell);
              ctx.fillRect(px, py, pw, ph);
            }
          }
        }
        ctx.restore();
        return true;
      };
    })();

    const cardCanvas = document.getElementById('card-canvas');
    const cardCtx = cardCanvas.getContext('2d');
    const cardTitle = document.getElementById('card-title');
    const cardSubtitle = document.getElementById('card-subtitle');
    const cardDetails = document.getElementById('card-details');
    const cardQr = document.getElementById('card-qr');
    const cardColor = document.getElementById('card-color');
    const cardAccent = document.getElementById('card-accent');
    const cardDownloadBtn = document.getElementById('card-download-btn');
    const cardStatus = document.getElementById('card-status');

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = String(text || '').split(/\s+/).filter(Boolean);
      let line = '';
      let curY = y;
      for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxWidth && line) {
          ctx.fillText(line, x, curY);
          line = word;
          curY += lineHeight;
        } else {
          line = test;
        }
      }
      if (line) ctx.fillText(line, x, curY);
      else curY -= lineHeight;
      return curY;
    }

    function renderCard() {
      const w = cardCanvas.width;
      const h = cardCanvas.height;

      cardCtx.clearRect(0, 0, w, h);
      cardCtx.fillStyle = '#ffffff';
      cardCtx.fillRect(0, 0, w, h);

      cardCtx.fillStyle = cardColor.value;
      cardCtx.fillRect(0, 0, 26, h);

      cardCtx.fillStyle = cardAccent.value;
      cardCtx.fillRect(26, 0, 8, h);

      cardCtx.fillStyle = cardColor.value;
      cardCtx.font = 'bold 34px system-ui, sans-serif';
      const afterTitle = wrapText(cardCtx, cardTitle.value || 'Título', 64, 82, 460, 42);

      cardCtx.fillStyle = cardAccent.value;
      cardCtx.font = '600 20px system-ui, sans-serif';
      const afterSub = wrapText(cardCtx, cardSubtitle.value || '', 64, afterTitle + 34, 460, 28);

      cardCtx.fillStyle = '#334155';
      cardCtx.font = '400 18px system-ui, sans-serif';
      wrapText(cardCtx, cardDetails.value || '', 64, afterSub + 42, 460, 26);

      const qrSize = 190;
      const qrX = w - 235;
      const qrY = h / 2 - qrSize / 2;
      const qrText = (cardQr.value || 'https://ejemplo.com').trim();

      const ok = QR_LOCAL(cardCtx, qrText, qrX, qrY, qrSize);
      if (!ok) {
        cardCtx.strokeStyle = '#94a3b8';
        cardCtx.strokeRect(qrX, qrY, qrSize, qrSize);
        cardCtx.fillStyle = '#64748b';
        cardCtx.font = '14px system-ui, sans-serif';
        cardCtx.fillText('Texto muy largo', qrX + 42, qrY + qrSize / 2);
      }
    }

    [cardTitle, cardSubtitle, cardDetails, cardQr, cardColor, cardAccent].forEach((el) => {
      el.addEventListener('input', renderCard);
    });

    cardDownloadBtn.addEventListener('click', () => {
      cardCanvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ficha-tarjeta.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        cardStatus.textContent = 'PNG descargado con QR local.';
      }, 'image/png');
    });

    renderCard();
  </script>
</body>
</html>
